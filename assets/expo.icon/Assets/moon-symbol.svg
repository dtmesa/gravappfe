<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bodyGrad" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#d9b8f5"/>
      <stop offset="100%" stop-color="#b77ae8"/>
    </radialGradient>

    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b06ae6"/>
      <stop offset="100%" stop-color="#6f28c8"/>
    </linearGradient>

    <linearGradient id="rimGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#c99af0"/>
      <stop offset="100%" stop-color="#a76be4"/>
    </linearGradient>
  </defs>

  <!-- Moon body -->
  <circle cx="256" cy="256" r="208" fill="url(#bodyGrad)"/>

  <!-- Craters -->
  <circle cx="120" cy="160" r="32" fill="#a965d7" opacity="0.65"/>
  <circle cx="122" cy="360" r="52" fill="#a965d7" opacity="0.65"/>
  <circle cx="274" cy="398" r="24" fill="#9f58d4" opacity="0.75"/>
  <circle cx="192" cy="84" r="15" fill="#9f58d4" opacity="0.75"/>
  <circle cx="104" cy="244" r="19" fill="#9f58d4" opacity="0.75"/>

  <!-- Crescent cutout -->
  <circle cx="370" cy="220" r="150" fill="url(#innerGrad)"/>

  <!-- Rim highlight -->
  <path d="
      M 298 74
      A 208 208 0 0 1 434 434
      A 166 166 0 0 0 298 74 Z"
      fill="url(#rimGrad)" opacity="0.55"/>
</svg>